name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession both publish debug-latest; without this the older run can finish last and overwrite the newer APK.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/vados-gallery.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vados-gallery
          path: out/

      # A rolling pre-release, so the newest build on master is always one download away from the phone. The tag keeps its old name so the link already on the phone keeps working.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest out/vados-gallery.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (master)" \
            --notes "Built from $GITHUB_SHA. Install vados-gallery.apk, the optimised build."

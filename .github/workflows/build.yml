name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession both publish debug-latest; without this the older run can finish last and overwrite the newer APK.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vados-gallery-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # A rolling pre-release, so the newest build on master is always one download away from the phone.
      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest app/build/outputs/apk/debug/app-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Debug build (latest master)" \
            --notes "Built from $GITHUB_SHA."

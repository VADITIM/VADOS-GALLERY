name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession both publish the same release; without this the older run can finish last and overwrite the newer APK.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          ./gradlew assembleRelease 2>&1 | tee build.log
          # The Kotlin errors are repeated here, last, so a failed run can be read from its tail instead of from the Gradle stack trace.
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then echo "=== COMPILER ERRORS ==="; grep -E '^e: |error:' build.log; exit 1; fi
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/vados-gallery-v$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vados-gallery
          path: out/

      # One release per version, tagged v<versionName>. Bump versionName in app/build.gradle.kts with every change; a push that keeps the version replaces that release.
      - name: Publish release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v$VERSION" --cleanup-tag --yes || true
          gh release create "v$VERSION" "out/vados-gallery-v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "Built from $GITHUB_SHA. Install vados-gallery-v$VERSION.apk."
